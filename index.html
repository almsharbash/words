<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fb8e8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>words</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e6f0fc;--bg2:#b9d4f3;--bg3:#8fb8e8;--ink:#1e3a5f;--mut:#5a7396;--brand:#4b86c8;--brand2:#2f6db5;--card:rgba(255,255,255,.8);--line:#c5daf3;--bad:#c0392b;--ok:#1f8a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16273d;--bg2:#1b3556;--bg3:#244a78;--ink:#e6f0fc;--mut:#9db8d9;--brand:#6aa3e6;--brand2:#8dbbf0;--card:rgba(22,39,61,.88);--line:#2f5382}}
:root[data-theme="dark"]{--bg1:#16273d;--bg2:#1b3556;--bg3:#244a78;--ink:#e6f0fc;--mut:#9db8d9;--brand:#6aa3e6;--brand2:#8dbbf0;--card:rgba(22,39,61,.88);--line:#2f5382}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
header img{width:40px;height:40px;border-radius:11px;object-fit:cover;box-shadow:0 2px 8px rgba(47,109,181,.3)}
#brand{font-size:1.7rem;font-weight:800;color:var(--brand2);user-select:none;cursor:pointer}
#view{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px}
nav{display:flex;gap:6px;margin:6px 14px 12px;padding:6px;background:var(--card);border-radius:18px;border:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mut);font-weight:700;font-size:.85rem;border-radius:12px;cursor:pointer}
nav button.on{background:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:1.1rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.lg{width:64px;height:64px;font-size:1.6rem}
.grow{flex:1;min-width:0}.t{font-weight:700}.s{font-size:.8rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.s.w{white-space:normal;line-height:1.6}
input,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;outline:none}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:1rem;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand2);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.flex{display:flex;gap:8px;align-items:center}
h2{font-size:1.15rem;color:var(--brand2)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.b{max-width:82%;padding:10px 14px;border-radius:18px;word-break:break-word;white-space:pre-wrap}
.b.me{align-self:flex-start;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.b.th{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.b small{display:block;font-size:.65rem;opacity:.75;margin-top:2px}
.mono{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;direction:ltr;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg1);padding:10px 18px;border-radius:20px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
#call{position:fixed;inset:0;background:#0d1b2e;z-index:99;display:none;flex-direction:column}
#call video#rv{flex:1;width:100%;object-fit:cover;min-height:0;background:#0d1b2e}
#call video#lv{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:100px;border-radius:12px;border:2px solid #fff;background:#000}
#call .ctl{display:flex;justify-content:center;gap:14px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
</style>
</head>

<div id="app">
  <header><span id="logo"></span><span id="brand">words</span><span style="flex:1"></span><span id="rs" class="s"></span><button class="btn sec sm" id="inst" style="display:none">馃摬 鬲孬亘賷鬲</button></header>
  <div id="view"></div>
  <nav id="nav"></nav>
  <div id="toast"></div>
</div>
