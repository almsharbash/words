<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحادثة المشفرة</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .status-badge {
            background-color: #10b981;
            color: #000;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background-color: #334155;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            word-break: break-word;
        }
        .message.sent {
            align-self: flex-start;
            background-color: #0284c7;
        }
        .encrypted-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            display: block;
            margin-top: 4px;
        }
        .input-area {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>أنابيب المحادثة المشفرة <span class="status-badge">E2EE</span></h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">أنبوب مفعل: secure_pipe_999</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message">
            مرحباً بك! هذه الواجهة متصلة بالنواة المشفرة.
            <span class="encrypted-tag">🔐 مشفرة بـ AES-256</span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="اكتب رسالة مشفرة..." />
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            
            if (input.value.trim() === '') return;

            // إنشاء عنصر الرسالة في الواجهة
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `
                ${input.value}
                <span class="encrypted-tag">🔒 تم التشفير والإرسال عبر الأنبوب</span>
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = '';
        }
    </script>
</body>
</html>
